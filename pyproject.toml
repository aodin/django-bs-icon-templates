[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "django-bs-icon-templates"
dynamic = ["version"]
description = "Bootstrap Icons as Django templates for embedded SVGs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "django>=4.0",
]

[project.optional-dependencies]
dev = ["build", "twine"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["bs_icon_templates"]
