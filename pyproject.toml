[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "django-bs-icon-templates"
version = "0.1.0"
description = "Django templates for Bootstrap Icons SVGs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "django>=4.0",
]

[project.optional-dependencies]
dev = ["build", "twine"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bs_icon_templates*"]

[tool.setuptools.package-data]
"bs_icon_templates" = ["templates/**/*"]
